name: Deploy Pangolin Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 48222 }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync configuration files to server
        run: |
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || 48222 }}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'config/config.yml' \
            --exclude 'config/traefik/dynamic_config.yml' \
            --exclude 'config/traefik/traefik_config.yml' \
            --exclude 'config/key' \
            --exclude 'config/db/' \
            --exclude 'config/letsencrypt/' \
            --exclude 'config/traefik/logs/' \
            --exclude 'config/crowdsec/db/' \
            ./ "${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}:/opt/pangolin/"

      - name: Run deploy script on remote host
        run: |
          ssh -p ${{ secrets.SSH_PORT || 48222 }} "${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}" 'bash /opt/pangolin/deploy.sh'
